<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9</title>
    <script src="9.js" defer></script>
</head>

<body>
    <h1>Task 9</h1>
    <input id="calculation" type="text" placeholder="enter calculation">
    <br>
    <button id="start">Calculate</button>
    <p id="result"></p>
</body>
<script>
    document.getElementById("start").addEventListener("click",()=>{
        var input = document.getElementById("calculation").value;
        var result = document.getElementById("result");
        if(input.includes("+")){
            var numbes = input.split("+");
            let number1 = Number(numbes[0]);
            let number2 = Number(numbes[1]);
            let sum = number1+number2;
            result.innerText = sum;
        }else if(input.includes("-")){
            var numbes = input.split("-");
            let number1 = Number(numbes[0]);
            let number2 = Number(numbes[1]);
            let sub = number1-number2;
            result.innerText = sub;
        }else if(input.includes("*")){
            var numbes = input.split("*");
            let number1 = Number(numbes[0]);
            let number2 = Number(numbes[1]);
            let multi = number1*number2;
            result.innerText = multi;
        }else if(input.includes("/")){
            var numbes = input.split("/");
            let number1 = Number(numbes[0]);
            let number2 = Number(numbes[1]);
            let div = number1/number2;
            result.innerText = div;
        }else{
            result.innerText = "Invalid input";
        }
    })
</script>
</html>

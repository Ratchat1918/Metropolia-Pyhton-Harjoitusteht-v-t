<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8</title>
    <script src="8.js" defer></script>
</head>

<body>
    <h1>Task 8</h1>
    <input id="num1" type="text" placeholder="enter first integer">
    <br>
    <input id="num2" type="text" placeholder="enter second integer">
    <br>
    <select id="operation">
        <option value="add">addition</option>
        <option value="sub">subtraction</option>
        <option value="multi">multiplication</option>
        <option value="div">division</option>
    </select>
    <br>
    <button id="start">Calculate</button>
    <p id="result"></p>
</body>
<script>
    document.querySelector("#start").addEventListener("click",()=>{
        let operation_input = document.querySelector("#operation").value;
        let input1 = Number(document.querySelector("#num1").value);
        let input2 = Number(document.querySelector("#num2").value);
        switch(operation_input){
            case "add":
                let sum = input1 + input2;
                document.querySelector("#result").textContent = `${sum}`
                break
            case "sub":
               let sub = input1 - input2;
               document.querySelector("#result").textContent = `${sub}`
               break
            case "multi":
               let multi = input1 * input2;
               document.querySelector("#result").textContent = `${multi}`
               break
            case "div":
               let div = input1 / input2;
               document.querySelector("#result").textContent = `${div}`
               break
        }
    })
</script>
</html>
